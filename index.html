<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Vikas Audio Studio - मिक्सिंग डैशबोर्ड</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
        header { padding: 40px; background: linear-gradient(to bottom, #1db954, #121212); border-radius: 20px; }
        h1 { font-size: 3rem; margin-bottom: 10px; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 40px; }
        .card { background: #1e1e1e; padding: 30px; border-radius: 15px; border: 1px solid #333; }
        .btn { display: block; background: #1db954; color: black; padding: 15px; margin: 10px 0; text-decoration: none; font-weight: bold; border-radius: 30px; }
        .btn:hover { background: #1ed760; }
    </style>
</head>
<body>

<header>
    <h1>Vikas Audio Studio</h1>
    <p>अपना संगीत मिक्स और एडिट करें</p>
</header>

<div class="container">
    <div class="card">
        <h2>प्रोजेक्ट्स</h2>
        <a href="#" class="btn">नया प्रोजेक्ट शुरू करें</a>
        <a href="#" class="btn">पुराने मिक्स लोड करें</a>
    </div>
    <div class="card">
        <h2>ऑडियो टूल्स</h2>
        <a href="https://www.bandlab.com/" target="_blank" class="btn">BandLab (ऑनलाइन DAW)</a>
        <a href="https://audio-joiner.com/" target="_blank" class="btn">ऑडियो जॉइनर/कटर</a>
    </div>
    <div class="card">
        <h2>प्रोफाइल & सेटिंग्स</h2>
        <a href="#" class="btn">मेरी मिक्सिंग लाइब्रेरी</a>
        <a href="#" class="btn" style="background:#ea4335; color:white;">सेटिंग्स</a>
    </div>
</div>

</body>
</html>
